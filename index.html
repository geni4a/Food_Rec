   ========================================================= */
const ROLE_LABELS = {main:'Main', supporting:'Supporting', garnish:'Garnish'};
const SCALE_LABELS = {linear:'Scales normally', taste:'To taste', none:"Don't scale"};
async function renderRecipeForm(app, id){
  let r;
  if(id != null){
    r = await getOne('recipes', id);
    if(!r){ app.innerHTML = notFound('Recipe not found.'); return; }
    r = JSON.parse(JSON.stringify(r));
  } else r = {title:'', base_servings:4, tags:[], prep_min:null, cook_min:null, source:'', notes:'', ingredients:[], steps:[]};
  const lines = r.ingredients.map(l => ({...l, candidates: [], createNew: false}));
  const allOpts = DICT.list.map(it => ({key: it.key, label: pathLabel(DICT, it.key)})).sort((a,b) => a.label.localeCompare(b.label));

  app.innerHTML = `<div class="page">
    <h1>${id != null ? 'Edit recipe' : 'Add a recipe'}</h1>
    <div class="field"><label>Title</label><input type="text" id="fTitle" value="${esc(r.title)}" placeholder="e.g. Weeknight chili"></div>
    <div class="grid3">
      <div class="field"><label>Serves</label><input type="number" id="fServ" min="1" value="${esc(r.base_servings)}"></div>
      <div class="field"><label>Prep (min)</label><input type="number" id="fPrep" min="0" value="${esc(r.prep_min ?? '')}"></div>
      <div class="field"><label>Cook (min)</label><input type="number" id="fCook" min="0" value="${esc(r.cook_min ?? '')}"></div>
    </div>
    <div class="field"><label>Tags</label><input type="text" id="fTags" value="${esc((r.tags||[]).join(', '))}" placeholder="vegetarian, quick, baking"><div class="hint">Comma-separated. Tag a recipe "baking" if exact amounts matter.</div></div>
    <div class="field"><label>Source</label><input type="text" id="fSource" value="${esc(r.source)}" placeholder="Book, website or person"></div>

    <h2>Ingredients</h2>
    <div class="field">
      <textarea id="fPaste" placeholder="Paste ingredient lines, one per line:
2 cups flour, sifted
1 (400 g) can chopped tomatoes [main]
salt and pepper to taste"></textarea>
      <div class="hint">Amount, unit, ingredient, then notes after a comma. Lines ending in ":" start a section (e.g. "For the sauce:"). Add [main] or [garnish] to mark importance — main ingredients count most in search.</div>
      <button class="btn small teal" id="parseBtn" style="margin-top:8px">Add these lines</button>
    </div>
    <div id="lines"></div>
    <button class="btn small ghost" id="addLine">+ Add a blank line</button>

    <h2>Method</h2>
    <div class="field">
      <textarea id="fSteps" style="min-height:150px" placeholder="One step per line">${esc(r.steps.join('\n'))}</textarea>
      <div class="hint">Amounts written in a step (like "add 2 tbsp olive oil") are linked to the ingredient list when you save, so they scale too. Linked amounts show as {#} — the number is the ingredient's line number.</div>
      <button class="btn small ghost" id="linkBtn" style="margin-top:8px">Link amounts now</button>
    </div>
    <div class="field"><label>Notes</label><textarea id="fNotes">${esc(r.notes)}</textarea></div>
    <div class="form-actions">
      <button class="btn" id="saveBtn" style="flex:1">Save recipe</button>
      <a class="btn ghost" href="${id != null ? '#/r/' + id : '#/'}">Cancel</a>
    </div>
  </div>`;

  const linesEl = document.getElementById('lines');
  const stepsEl = document.getElementById('fSteps');

  function keyOptions(line){
    const out = [];
    if(!line.key && !line.createNew) out.push(`<option value="" selected disabled>Choose which one…</option>`);
    if(line.candidates && line.candidates.length > 1)
      out.push(`<optgroup label="Did you mean">${line.candidates.map(k => `<option value="${esc(k)}" ${line.key === k ? 'selected' : ''}>${esc(pathLabel(DICT, k))}</option>`).join('')}</optgroup>`);
    const nm = coreName(line.name) || line.name;
    out.push(`<option value="__new__" ${line.createNew ? 'selected' : ''}>+ New ingredient: "${esc(nm)}"</option>`);
    out.push(`<optgroup label="All ingredients">${allOpts.map(o => `<option value="${esc(o.key)}" ${line.key === o.key ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</optgroup>`);
    return out.join('');
  }
  function lineHtml(line, i){
    const ing = line.key ? DICT.byKey[line.key] : null;
    const forms = ing && ing.forms && ing.forms.length ? ing.forms : FORMS;
    let status;
    if(ing) status = `<div class="status ok">✓ ${esc(pathLabel(DICT, ing.key))}</div>`;
    else if(line.createNew) status = `<div class="status new">+ Will be added to your ingredient dictionary</div>`;
    else status = `<div class="status bad">⚠ "${esc(line.name)}" could mean several things — pick one</div>`;
    return `<div class="line-card" data-i="${i}">
      <div class="line-top">
        <span class="line-idx">#${i}</span>
        <input type="text" class="qty" value="${esc(qtyToText(line.qty, line.qtyMax))}" placeholder="qty" inputmode="decimal">
        <select class="unit"><option value="">—</option>${UNIT_KEYS.map(k => `<option value="${k}" ${line.unit === k ? 'selected' : ''}>${UNITS[k].one}</option>`).join('')}</select>
        <input type="text" class="lname" value="${esc(line.name)}" placeholder="ingredient">
        <button class="icon-btn del" title="Remove">✕</button>
      </div>
      <div class="line-grid">
        <label class="full">Ingredient<select class="lkey">${keyOptions(line)}</select></label>
        <label>Form<select class="lform"><option value="any">any</option>${forms.map(fm => `<option value="${fm}" ${line.form === fm ? 'selected' : ''}>${fm}</option>`).join('')}</select></label>
        <label>Importance<select class="lrole">${Object.entries(ROLE_LABELS).map(([v,l]) => `<option value="${v}" ${line.role === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label>Note<input type="text" class="lnote" value="${esc(line.note)}" placeholder="diced, to serve…"></label>
        <label>Scaling<select class="lscale">${Object.entries(SCALE_LABELS).map(([v,l]) => `<option value="${v}" ${line.scale === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label>Section<input type="text" class="lsection" value="${esc(line.section)}" placeholder="optional"></label>
        <label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" class="lopt" ${line.optional ? 'checked' : ''}> Optional</label>
      </div>
      ${status}
    </div>`;
  }
  const drawLines = ()=>{
    linesEl.innerHTML = lines.length ? lines.map(lineHtml).join('') : '<p class="meta" style="margin-bottom:10px">No ingredients yet — paste some above.</p>';
  };
  const redrawLine = i => {
    const card = linesEl.querySelector(`.line-card[data-i="${i}"]`);
    if(card) card.outerHTML = lineHtml(lines[i], i);
  };
  drawLines();

  linesEl.addEventListener('change', e=>{
    const card = e.target.closest('.line-card'); if(!card) return;
    const i = +card.dataset.i, line = lines[i], t = e.target;
    if(t.classList.contains('qty')){
      const p = parseQtyString(t.value);
      t.classList.toggle('bad', !p);
      if(p){ line.qty = p.qty; line.qtyMax = p.qtyMax; }
    }
    else if(t.classList.contains('unit')) line.unit = t.value || null;
    else if(t.classList.contains('lname')){
      line.name = t.value.trim();
      const rr = resolveName(DICT, line.name);
      line.key = rr.key; line.candidates = rr.candidates;
      line.createNew = !rr.key && !rr.candidates.length;
      line.form = rr.form || 'any';
      if(rr.key && DICT.byKey[rr.key].default_scale && line.scale === 'linear') line.scale = DICT.byKey[rr.key].default_scale;
      redrawLine(i);
    }
    else if(t.classList.contains('lkey')){
      const v = t.value;
      if(v === '__new__'){ line.key = null; line.createNew = true; }
      else{
        line.key = v; line.createNew = false;
        const fs = DICT.byKey[v].forms || [];
        if(line.form !== 'any' && fs.length && !fs.includes(line.form)) line.form = 'any';
        if(DICT.byKey[v].default_scale && line.scale === 'linear') line.scale = DICT.byKey[v].default_scale;
      }
      redrawLine(i);
    }
    else if(t.classList.contains('lform')) line.form = t.value;
    else if(t.classList.contains('lrole')) line.role = t.value;
    else if(t.classList.contains('lscale')) line.scale = t.value;
    else if(t.classList.contains('lnote')) line.note = t.value.trim();
    else if(t.classList.contains('lsection')) line.section = t.value.trim().toLowerCase();
    else if(t.classList.contains('lopt')) line.optional = t.checked;
  });
  linesEl.addEventListener('click', e=>{
    const b = e.target.closest('.del'); if(!b) return;
    const i = +b.closest('.line-card').dataset.i;
    const removed = lines[i];
    lines.splice(i, 1);
    // keep {n} tokens in the method pointing at the right lines
    stepsEl.value = stepsEl.value.replace(/\{(\d+)\}/g, (m0, n)=>{
      n = +n;
      if(n === i) return removed.qty != null ? formatRange(removed.qty, removed.qtyMax, removed.unit, 'entered') : '';
      return n > i ? `{${n-1}}` : m0;
    });
    drawLines();
  });
  document.getElementById('parseBtn').onclick = ()=>{
    const ta = document.getElementById('fPaste');
    const parsed = parseIngredientText(ta.value, DICT);
    if(!parsed.length){ toast('Nothing to add — paste one ingredient per line'); return; }
    for(const l of parsed){ l.createNew = !l.key && !l.candidates.length; lines.push(l); }
    ta.value = '';
    drawLines();
    const unsure = parsed.filter(l => !l.key).length;
    toast(`Added ${parsed.length} line${parsed.length > 1 ? 's' : ''}${unsure ? ` — check ${unsure} not yet in the dictionary` : ''}`);
  };
  document.getElementById('addLine').onclick = ()=>{
    lines.push({qty:null, qtyMax:null, unit:null, name:'', key:null, candidates:[], createNew:true, form:'any', note:'', role:'supporting', optional:false, scale:'linear', section:''});
    drawLines();
    const cards = linesEl.querySelectorAll('.line-card');
    cards[cards.length-1].querySelector('.lname').focus();
  };
  const currentSteps = ()=> stepsEl.value.split('\n').map(s => s.trim()).filter(Boolean);
  document.getElementById('linkBtn').onclick = ()=>{
    const before = stepsEl.value;
    stepsEl.value = autoLinkSteps(currentSteps(), lines, DICT).join('\n');
    const n = (stepsEl.value.match(/\{\d+\}/g) || []).length - (before.match(/\{\d+\}/g) || []).length;
    toast(n > 0 ? `Linked ${n} amount${n > 1 ? 's' : ''}` : 'No new amounts to link');
  };

  document.getElementById('saveBtn').onclick = async ()=>{
    const title = document.getElementById('fTitle').value.trim();
    if(!title){ toast('Give the recipe a title'); return; }
    const named = lines.filter(l => l.name);
    if(!named.length){ toast('Add at least one ingredient'); return; }
    const badQty = linesEl.querySelector('input.qty.bad');
    if(badQty){ toast('Fix the highlighted amount (e.g. 2, 1 1/2, ½, 2-3)'); return; }
    const amb = lines.findIndex(l => l.name && !l.key && !l.createNew);
    if(amb >= 0){ toast(`Pick which ingredient line #${amb} means`); return; }
    // create new dictionary entries
    let created = 0;
    for(const l of lines){
      if(!l.name || l.key || !l.createNew) continue;
      const nm = coreName(l.name) || normText(l.name);
      const key = slugify(nm);
      if(!key) continue;
      if(!DICT.byKey[key]){
        await putOne('ingredients', {key, display: capitalize(nm), parent:null, aliases:[], forms:[], staple:false, whole_only:false,
          aisle:'other', related:[], sibling_score:0.5, form_overrides:{}, form_ratios:{}, default_scale:'linear'});
        created++;
        await loadDict();
      }
      l.key = key; l.createNew = false;
    }
    const keep = lines.filter(l => l.name);
    // blank lines are dropped, so renumber {n} tokens to the kept lines
    const newIndex = {};
    let k = 0;
    lines.forEach((l, i)=>{ if(l.name) newIndex[i] = k++; });
    const stepText = stepsEl.value.replace(/\{(\d+)\}/g, (m0, n)=> newIndex[+n] != null ? `{${newIndex[+n]}}` : '');
    const ingredients = keep.map(cleanLine);
    const steps = autoLinkSteps(stepText.split('\n').map(s => s.trim()).filter(Boolean), ingredients, DICT);
    const num = v => v === '' || v == null ? null : Math.max(0, +v);
    const rec = {
      ...r,
      title,
      base_servings: Math.max(1, +document.getElementById('fServ').value || 1),
      prep_min: num(document.getElementById('fPrep').value),
      cook_min: num(document.getElementById('fCook').value),
      tags: document.getElementById('fTags').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean),
      source: document.getElementById('fSource').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      ingredients, steps,
    };
    if(id == null){ rec.created = new Date().toISOString(); rec.last_cooked = null; delete rec.id; }
    const newId = id != null ? (await putOne('recipes', rec), id) : await addOne('recipes', rec);
    toast(`Recipe saved${created ? ` · ${created} new ingredient${created > 1 ? 's' : ''} added` : ''}`);
    location.hash = `#/r/${newId}`;
  };
}

/* =========================================================
   SEARCH — what can I make?
   ========================================================= */
const SEARCH = {maxMissing:'', tag:'', maxTime:'', sort:'coverage'};
async function renderSearch(app){
  const recipes = await getAll('recipes');
  let haves = (await getSetting('search_haves', [])).filter(h => DICT.byKey[h.key]);
  const tags = [...new Set(recipes.flatMap(r => r.tags || []))].sort();
  const names = new Set();
  for(const it of DICT.list){ names.add(it.display); for(const a of (it.aliases||[])) names.add(a); }

  app.innerHTML = `<div class="page">
    <h1>What can I make?</h1>
    <div class="add-row">
      <input type="text" id="sIn" list="ingNames" placeholder="Add an ingredient you have" autocomplete="off">
      <button class="btn" id="sAdd">Add</button>
    </div>
    <datalist id="ingNames">${[...names].sort().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div id="sPick"></div>
    <div class="chips" id="haves" style="margin:12px 0 6px"></div>
    <div class="hint" id="haveHint"></div>
    <div class="card" style="margin-top:12px">
      <div class="grid2">
        <div><div class="lbl">Missing at most</div><select id="fMiss">${[['','Any'],['0','Nothing'],['1','1 item'],['2','2 items'],['3','3 items']].map(([v,l]) => `<option value="${v}" ${SEARCH.maxMissing === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div><div class="lbl">Sort by</div><select id="fSort"><option value="coverage" ${SEARCH.sort === 'coverage' ? 'selected' : ''}>Best match</option><option value="uses" ${SEARCH.sort === 'uses' ? 'selected' : ''}>Uses most of my items</option></select></div>
        <div><div class="lbl">Tag</div><select id="fTag"><option value="">Any</option>${tags.map(t => `<option ${SEARCH.tag === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
        <div><div class="lbl">Total time</div><select id="fTime">${[['','Any'],['15','≤ 15 min'],['30','≤ 30 min'],['45','≤ 45 min'],['60','≤ 1 h'],['90','≤ 1½ h']].map(([v,l]) => `<option value="${v}" ${SEARCH.maxTime === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
    </div>
    <ul class="plain" id="results"></ul>
  </div>`;

  const havesEl = document.getElementById('haves'), pickEl = document.getElementById('sPick'), resEl = document.getElementById('results');
  const save = ()=> setSetting('search_haves', haves);
  const drawHaves = ()=>{
    havesEl.innerHTML = haves.map((h, i) => {
      const it = DICT.byKey[h.key];
      const forms = it.forms || [];
      return `<span class="have" data-i="${i}">${esc(it.display)}
        ${forms.length ? `<select class="hform"><option value="any">any form</option>${forms.map(f => `<option ${h.form === f ? 'selected' : ''}>${f}</option>`).join('')}</select>` : ''}
        <button class="hdel" title="Remove">✕</button></span>`;
    }).join('') + (haves.length > 1 ? `<button class="chip" id="clearHaves">Clear all</button>` : '');
    const staples = DICT.list.filter(it => it.staple).map(it => it.display);
    document.getElementById('haveHint').textContent = haves.length
      ? `Always assumed: ${staples.join(', ')}. Change staples in Ingredients.`
      : 'Add what\'s in your fridge and cupboard. Recipes are scored by how much of them you can cover — main ingredients count most.';
  };
  const drawResults = ()=>{
    const res = searchRecipes(recipes, haves, DICT, {
      maxMissing: SEARCH.maxMissing === '' ? null : +SEARCH.maxMissing,
      tag: SEARCH.tag, maxTime: SEARCH.maxTime ? +SEARCH.maxTime : 0, sort: SEARCH.sort,
    });
    if(!haves.length){ resEl.innerHTML = ''; return; }
    if(!res.length){
      const hidden = searchRecipes(recipes, haves, DICT, {}).length;
      resEl.innerHTML = `<p class="empty">${hidden ? `The filters are hiding ${hidden} recipe${hidden > 1 ? 's' : ''} that use your ingredients — try loosening them.` : 'None of your recipes use these ingredients yet.'}</p>`;
      return;
    }
    resEl.innerHTML = `<p class="meta" style="margin:4px 0 10px">${res.length} recipe${res.length > 1 ? 's' : ''}</p>` + res.slice(0, 40).map(x => {
      const pct = Math.round(x.coverage * 100);
      const cls = pct >= 80 ? 'hi' : pct >= 50 ? 'mid' : 'lo';
      const total = (+x.recipe.prep_min||0) + (+x.recipe.cook_min||0);
      return `<li class="res">
        <div class="plate ${cls}">${pct}%</div>
        <div class="res-body">
          <a href="#/r/${x.recipe.id}"><strong>${esc(x.recipe.title)}</strong></a>
          <span class="meta">${x.exact.length} matched${total ? ' · ' + fmtMin(total) : ''} · uses ${x.usedCount} of your ${haves.length} item${haves.length > 1 ? 's' : ''}</span>
          ${x.missing.length ? `<span class="meta miss">Missing: ${x.missing.map(esc).join(', ')}</span>` : `<span class="meta sub">Nothing missing</span>`}
          ${x.subs.map(s => `<span class="meta sub">↺ ${esc(s.have)} for ${esc(s.need)} (${Math.round(s.score*100)}%)${s.hint ? ' — ' + esc(s.hint) : ''}</span>`).join('')}
        </div></li>`;
    }).join('');
  };
  const addHave = (key, form)=>{
    form = form || 'any';
    if(haves.some(h => h.key === key && (h.form || 'any') === form)){ toast(`${DICT.byKey[key].display} is already on your list`); return; }
    haves.push({key, form});
    save(); drawHaves(); drawResults();
  };
  const tryAdd = ()=>{
    const inp = document.getElementById('sIn');
    const txt = inp.value.trim();
    pickEl.innerHTML = '';
    if(!txt) return;
    const r = resolveName(DICT, txt);
    if(r.key){ addHave(r.key, r.form); inp.value = ''; return; }
    if(r.candidates.length > 1){
      pickEl.innerHTML = `<div class="card" style="margin-top:10px"><div class="lbl">Which "${esc(txt)}"?</div><div class="chips">${r.candidates.map(k => `<button class="chip" data-k="${esc(k)}" data-f="${esc(r.forms[0] || '')}">${esc(pathLabel(DICT, k))}</button>`).join('')}</div></div>`;
      return;
    }
    toast(`"${txt}" isn't in your ingredient dictionary yet — add it under Ingredients`);
  };
  pickEl.onclick = e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    const it = DICT.byKey[b.dataset.k];
    addHave(b.dataset.k, (it.forms||[]).includes(b.dataset.f) ? b.dataset.f : 'any');
    pickEl.innerHTML = ''; document.getElementById('sIn').value = '';
  };
  document.getElementById('sAdd').onclick = tryAdd;
  document.getElementById('sIn').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); tryAdd(); } });
  havesEl.addEventListener('change', e=>{
    if(!e.target.classList.contains('hform')) return;
    haves[+e.target.closest('.have').dataset.i].form = e.target.value;
    save(); drawResults();
  });
  havesEl.addEventListener('click', e=>{
    if(e.target.id === 'clearHaves'){ haves = []; save(); drawHaves(); drawResults(); return; }
    const b = e.target.closest('.hdel'); if(!b) return;
    haves.splice(+b.closest('.have').dataset.i, 1);
    save(); drawHaves(); drawResults();
  });
  const bindFilter = (id, field) => document.getElementById(id).onchange = e=>{ SEARCH[field] = e.target.value; drawResults(); };
  bindFilter('fMiss', 'maxMissing'); bindFilter('fSort', 'sort'); bindFilter('fTag', 'tag'); bindFilter('fTime', 'maxTime');
  drawHaves(); drawResults();
}

let ING_Q = '';
const AISLES = ['produce','meat','seafood','dairy','bakery','grains','pantry','baking','spices','frozen','other'];
async function renderIngredients(app){
  const recipes = await getAll('recipes');
  const usage = {};
  for(const r of recipes) for(const l of r.ingredients) if(l.key) usage[l.key] = (usage[l.key] || 0) + 1;
  app.innerHTML = `<div class="page">
    <h1>Ingredients <span class="count">${DICT.list.length}</span></h1>
    <div class="add-row" style="margin-bottom:14px">
      <input type="search" id="iq" placeholder="Find an ingredient" value="${esc(ING_Q)}">
      <a class="btn" href="#/i/new">+ New</a>
    </div>
    <div class="hint" style="margin:-4px 0 12px">Sub-types sit under their parent (Chili pepper › Jalapeño). Forms like canned or dried are set on each ingredient, not in the tree.</div>
    <div id="tree"></div>
  </div>`;
  const treeEl = document.getElementById('tree');
  const badges = it => `<span class="tags">${it.staple ? '<span class="tag green">staple</span>' : ''}${(it.forms||[]).length ? `<span class="tag">${it.forms.length} forms</span>` : ''}${usage[it.key] ? `<span class="tag accent">${usage[it.key]} recipe${usage[it.key] > 1 ? 's' : ''}</span>` : ''}</span>`;
  const nodeHtml = key => {
    const it = DICT.byKey[key];
    const kids = DICT.children[key] || [];
    return `<li><div class="node"><a href="#/i/${encodeURIComponent(key)}">${esc(it.display)}</a>${badges(it)}</div>${kids.length ? `<ul>${kids.map(nodeHtml).join('')}</ul>` : ''}</li>`;
  };
  const draw = ()=>{
    const q = normText(ING_Q);
    if(!q){ treeEl.innerHTML = `<ul class="tree">${(DICT.children[''] || []).map(nodeHtml).join('')}</ul>`; return; }
    const hits = DICT.list.filter(it => normText([it.display, it.key, ...(it.aliases||[])].join(' ')).includes(q));
    treeEl.innerHTML = hits.length ? `<ul class="tree">${hits.map(it => `<li><div class="node"><a href="#/i/${encodeURIComponent(it.key)}">${esc(pathLabel(DICT, it.key))}</a>${badges(it)}</div></li>`).join('')}</ul>`
      : `<p class="empty">No match. <a href="#/i/new">Add "${esc(ING_Q)}"</a></p>`;
  };
  draw();
  document.getElementById('iq').addEventListener('input', e=>{ ING_Q = e.target.value; draw(); });
}

function pairsToText(obj){ return Object.entries(obj || {}).map(([k,v]) => `${k}=${v}`).join('\n'); }
function textToPairs(text){
  const out = {};
  for(const raw of String(text||'').split('\n')){
    const t = raw.trim(); if(!t) continue;
    const m = t.match(/^([a-z-]+)\s*>\s*([a-z-]+)\s*=\s*([\d.]+)$/i);
    if(!m) throw new Error(`Couldn't read "${t}" — use the pattern fresh>dried=0.5`);
    out[`${m[1].toLowerCase()}>${m[2].toLowerCase()}`] = +m[3];
  }
  return out;
}
async function renderIngredientForm(app, key){
  const isNew = key == null;
  const src = isNew ? {key:'', display:'', parent:null, aliases:[], forms:[], staple:false, whole_only:false, aisle:'other', related:[],
    sibling_score:0.5, form_overrides:{}, form_ratios:{}, default_scale:'linear'} : DICT.byKey[key];
  if(!src){ app.innerHTML = notFound('Ingredient not found.'); return; }
  const it = JSON.parse(JSON.stringify(src));
  const recipes = await getAll('recipes');
  const usedIn = isNew ? [] : recipes.filter(r => r.ingredients.some(l => l.key === key));
  const kids = isNew ? [] : (DICT.children[key] || []);
  const blocked = isNew ? new Set() : new Set([key, ...descendants(DICT, key)]);
  const parentOpts = DICT.list.filter(x => !blocked.has(x.key)).map(x => ({key: x.key, label: pathLabel(DICT, x.key)})).sort((a,b) => a.label.localeCompare(b.label));
  const formsOn = new Set(it.forms || []);

  app.innerHTML = `<div class="page">
    <h1>${isNew ? 'New ingredient' : esc(it.display)}</h1>
    ${!isNew ? `<p class="meta" style="margin:-8px 0 14px">${esc(pathLabel(DICT, key))}</p>` : ''}
    <div class="field"><label>Name</label><input type="text" id="gName" value="${esc(it.display)}" placeholder="e.g. Habanero"></div>
    <div class="field"><label>Kind of… (parent)</label>
      <select id="gParent"><option value="">— Nothing (top level) —</option>${parentOpts.map(o => `<option value="${esc(o.key)}" ${it.parent === o.key ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>
      <div class="hint">Put it under the general ingredient it's a type of. A recipe asking for the parent is satisfied by any of its sub-types.</div></div>
    <div class="field"><label>Other names</label><input type="text" id="gAliases" value="${esc((it.aliases||[]).join(', '))}" placeholder="scallion, spring onion"><div class="hint">Comma-separated. Used when reading pasted recipes and in search.</div></div>
    <div class="field"><label>Forms it comes in</label>
      <div class="chips" id="gForms">${FORMS.map(f => `<button type="button" class="chip ${formsOn.has(f) ? 'on' : ''}" data-f="${f}">${f}</button>`).join('')}</div>
      <div class="hint">Leave all off if the form doesn't matter. Juice, zest, yolk and white are parts — they never substitute for each other.</div></div>
    <div class="grid2">
      <div class="field"><label>Aisle</label><select id="gAisle">${AISLES.map(a => `<option ${it.aisle === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
      <div class="field"><label>Default scaling</label><select id="gScale">${Object.entries(SCALE_LABELS).map(([v,l]) => `<option value="${v}" ${it.default_scale === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label class="chk"><input type="checkbox" id="gStaple" ${it.staple ? 'checked' : ''}> Staple — always in my kitchen</label><div class="hint">Staples don't count against a recipe in search. Sub-types inherit this.</div></div>
    <div class="field"><label class="chk"><input type="checkbox" id="gWhole" ${it.whole_only ? 'checked' : ''}> Comes in whole units</label><div class="hint">Like eggs: warns when scaling gives an awkward fraction.</div></div>
    <div class="field"><label>Related ingredients</label><input type="text" id="gRelated" value="${esc((it.related||[]).map(k => DICT.byKey[k] ? DICT.byKey[k].display : k).join(', '))}" placeholder="lime">
      <div class="hint">Close substitutes outside its own branch (lemon ↔ lime). They count as a 50% match.</div></div>
    <div class="field"><label>Sub-types substitute for each other</label>
      <input type="number" id="gSib" min="0" max="1" step="0.05" value="${esc(it.sibling_score ?? 0.5)}">
      <div class="hint">Only matters if this ingredient has sub-types. 0.8 = swap freely (pasta shapes) · 0.25 = poorly (different herbs).</div></div>
    <details class="more"><summary>Advanced: form substitution</summary>
      <div class="field" style="margin-top:10px"><label>Form match scores</label><textarea id="gOv" placeholder="fresh>dried=0.8">${esc(pairsToText(it.form_overrides))}</textarea>
        <div class="hint">One per line. Overrides the defaults (e.g. fresh↔canned 0.7) for this ingredient and its sub-types.</div></div>
      <div class="field"><label>Form amount ratios</label><textarea id="gRatio" placeholder="fresh>dried=0.33">${esc(pairsToText(it.form_ratios))}</textarea>
        <div class="hint">"fresh>dried=0.33" means: replacing fresh with dried, use a third as much. Shown as a tip in search.</div></div>
    </details>
    <div class="form-actions">
      <button class="btn" id="gSave" style="flex:1">${isNew ? 'Add ingredient' : 'Save'}</button>
      <a class="btn ghost" href="#/ingredients">Cancel</a>
    </div>
    ${isNew ? '' : `
      <hr class="rule">
      ${kids.length ? `<h2>Sub-types</h2><div class="chips">${kids.map(k => `<a class="chip" href="#/i/${encodeURIComponent(k)}">${esc(DICT.byKey[k].display)}</a>`).join('')}</div>` : ''}
      <h2>Used in</h2>
      ${usedIn.length ? `<ul class="plain">${usedIn.map(r => `<li class="kv"><a href="#/r/${r.id}">${esc(r.title)}</a></li>`).join('')}</ul>` : '<p class="meta">Not used in any recipe yet.</p>'}
      <h2>Merge</h2>
      <p class="meta" style="margin-bottom:8px">Same ingredient under two names? Merge this one into the other: recipes are updated, its names become aliases, and its sub-types move across.</p>
      <div class="add-row"><select id="gMergeTo"><option value="">Merge into…</option>${DICT.list.filter(x => x.key !== key).map(x => `<option value="${esc(x.key)}">${esc(pathLabel(DICT, x.key))}</option>`).join('')}</select>
        <button class="btn ghost" id="gMerge">Merge</button></div>
      <div class="form-actions"><button class="btn danger" id="gDel">Delete ingredient</button></div>`}
  </div>`;

  document.getElementById('gForms').onclick = e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    const f = b.dataset.f;
    if(formsOn.has(f)) formsOn.delete(f); else formsOn.add(f);
    b.classList.toggle('on', formsOn.has(f));
  };
  document.getElementById('gSave').onclick = async ()=>{
    const display = document.getElementById('gName').value.trim();
    if(!display){ toast('Give it a name'); return; }
    let ov, ratio;
    try{ ov = textToPairs(document.getElementById('gOv').value); ratio = textToPairs(document.getElementById('gRatio').value); }
    catch(err){ toast(err.message); return; }
    const related = [];
    for(const nm of document.getElementById('gRelated').value.split(',').map(s => s.trim()).filter(Boolean)){
      const rr = resolveName(DICT, nm);
      const k = rr.key || (rr.candidates.length === 1 ? rr.candidates[0] : null);
      if(!k){ toast(`Couldn't find "${nm}" in the dictionary${rr.candidates.length > 1 ? ' — it matches several; be more specific' : ''}`); return; }
      if(k !== key) related.push(k);
    }
    const out = {...it,
      display,
      parent: document.getElementById('gParent').value || null,
      aliases: document.getElementById('gAliases').value.split(',').map(s => s.trim()).filter(Boolean),
      forms: FORMS.filter(f => formsOn.has(f)),
      aisle: document.getElementById('gAisle').value,
      default_scale: document.getElementById('gScale').value,
      staple: document.getElementById('gStaple').checked,
      whole_only: document.getElementById('gWhole').checked,
      related: [...new Set(related)],
      sibling_score: Math.min(1, Math.max(0, +document.getElementById('gSib').value || 0)),
      form_overrides: ov, form_ratios: ratio,
    };
    if(isNew){
      out.key = slugify(display);
      if(!out.key){ toast('That name has no letters or numbers'); return; }
      if(DICT.byKey[out.key]){ toast(`"${DICT.byKey[out.key].display}" already exists`); return; }
    }
    await putOne('ingredients', out);
    toast(isNew ? 'Ingredient added' : 'Saved');
    location.hash = '#/ingredients';
  };
  if(isNew) return;

  document.getElementById('gMerge').onclick = async ()=>{
    const to = document.getElementById('gMergeTo').value;
    if(!to){ toast('Choose the ingredient to merge into'); return; }
    const target = DICT.byKey[to];
    if(!(await appConfirm(`Merge "${it.display}" into "${target.display}"? ${usedIn.length} recipe${usedIn.length === 1 ? '' : 's'} will be updated.`, 'Merge'))) return;
    await mergeIngredient(key, to);
    toast(`Merged into ${target.display}`);
    location.hash = `#/i/${encodeURIComponent(to)}`;
  };
  document.getElementById('gDel').onclick = async ()=>{
    if(usedIn.length){ toast(`Used in ${usedIn.length} recipe${usedIn.length > 1 ? 's' : ''} — merge it into another ingredient instead`); return; }
    if(!(await appConfirm(`Delete "${it.display}"?${kids.length ? ' Its sub-types move up a level.' : ''}`, 'Delete'))) return;
    const all = await getAll('ingredients');
    for(const x of all){
      let changed = false;
      if(x.parent === key){ x.parent = it.parent || null; changed = true; }
      if((x.related||[]).includes(key)){ x.related = x.related.filter(k => k !== key); changed = true; }
      if(changed) await putOne('ingredients', x);
    }
    await deleteOne('ingredients', key);
    const haves = await getSetting('search_haves', []);
    await setSetting('search_haves', haves.filter(h => h.key !== key));
    toast('Ingredient deleted');
    location.hash = '#/ingredients';
  };
}
async function mergeIngredient(from, to){
  const all = await getAll('ingredients');
  const src = all.find(x => x.key === from), dst = all.find(x => x.key === to);
  // never create a loop: if the target sits under the source, lift it to the source's parent
  if(ancestors(DICT, to).includes(from)) dst.parent = src.parent && src.parent !== to ? src.parent : null;
  const seenAlias = new Set([normName(dst.display)]);
  dst.aliases = [...dst.aliases, src.display, ...src.aliases].filter(a => { const n = normName(a); if(seenAlias.has(n)) return false; seenAlias.add(n); return true; });
  dst.forms = [...new Set([...(dst.forms||[]), ...(src.forms||[])])];
  dst.related = [...new Set([...(dst.related||[]), ...(src.related||[])])].filter(k => k !== to && k !== from);
  for(const x of all){
    if(x.key === from || x.key === to) continue;
    let changed = false;
    if(x.parent === from){ x.parent = to; changed = true; }
    if((x.related||[]).includes(from)){ x.related = [...new Set(x.related.map(k => k === from ? to : k))].filter(k => k !== x.key); changed = true; }
    if(changed) await putOne('ingredients', x);
  }
  await putOne('ingredients', dst);
  await deleteOne('ingredients', from);
  for(const r of await getAll('recipes')){
    if(!r.ingredients.some(l => l.key === from)) continue;
    for(const l of r.ingredients){
      if(l.key !== from) continue;
      l.key = to;
      if(l.form !== 'any' && (dst.forms||[]).length && !dst.forms.includes(l.form)) l.form = 'any';
    }
    await putOne('recipes', r);
  }
  const haves = await getSetting('search_haves', []);
  await setSetting('search_haves', haves.map(h => h.key === from ? {...h, key: to} : h));
  await loadDict();
}

/* =========================================================
   HISTORY
   ========================================================= */
async function renderHistory(app){
  const [hist, recipes] = await Promise.all([getAll('history'), getAll('recipes')]);
  const byId = Object.fromEntries(recipes.map(r => [r.id, r]));
  hist.sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.id - a.id);
  const groups = [];
  for(const h of hist){
    const label = new Date((h.date||todayStr()) + 'T00:00:00').toLocaleDateString(undefined, {month:'long', year:'numeric'});
    let g = groups[groups.length-1];
    if(!g || g.label !== label){ g = {label, items:[]}; groups.push(g); }
    g.items.push(h);
  }
  app.innerHTML = `<div class="page">
    <h1>Cook history <span class="count">${hist.length}</span></h1>
    ${hist.length ? groups.map(g => `<h2>${esc(g.label)}</h2><ul class="plain">${g.items.map(h => {
      const r = byId[h.recipe_id];
      return `<li class="card" style="padding:12px 14px;margin-bottom:8px;cursor:pointer" data-id="${h.id}">
        <div style="display:flex;justify-content:space-between;gap:10px"><strong>${r ? esc(r.title) : '<span class="note">Deleted recipe</span>'}</strong><span style="color:var(--accent)">${'★'.repeat(h.rating||0)}</span></div>
        <span class="meta">${fmtDate(h.date)}${h.scale && h.scale !== 1 ? ' · ' + factorLabel(h.scale) : ''}${h.notes ? ' · ' + esc(h.notes) : ''}</span></li>`;
    }).join('')}</ul>`).join('')
    : '<p class="empty">Nothing logged yet. Open a recipe and tap "I cooked this" after you make it.</p>'}
    <hr class="rule"><a href="#/backup">⇩ Backup &amp; restore</a>
  </div>`;
  app.querySelectorAll('li[data-id]').forEach(li => li.onclick = async e=>{
    const h = hist.find(x => x.id === +li.dataset.id);
    if(e.target.closest('a')) return;
    if(await openCookModal({recipe: byId[h.recipe_id], entry: h})) renderHistory(app);
  });
}

/* =========================================================
   BACKUP
   ========================================================= */
async function renderBackup(app){
  const [recipes, ingredients, history] = await Promise.all([getAll('recipes'), getAll('ingredients'), getAll('history')]);
  app.innerHTML = `<div class="page">
    <h1>Backup &amp; restore</h1>
    <p class="meta" style="line-height:1.5;margin-bottom:16px">Everything lives only on this device. Export a backup now and then so clearing your browser data or changing phones doesn't lose your recipes.</p>
    <div class="card">
      <div class="kv"><span>Recipes</span><span class="mono">${recipes.length}</span></div>
      <div class="kv"><span>Ingredients</span><span class="mono">${ingredients.length}</span></div>
      <div class="kv"><span>Cook log entries</span><span class="mono">${history.length}</span></div>
    </div>
    <button class="btn block" id="exportBtn">Export backup (.json)</button>
    <hr class="rule">
    <div class="field"><label>Restore from backup</label><input type="file" id="importFile" accept="application/json,.json">
      <div class="hint">Replaces everything currently stored on this device.</div></div>
    <hr class="rule">
    <button class="btn ghost block" id="starterBtn">Add any missing starter ingredients</button>
    <div class="hint" style="margin-bottom:14px">Adds the built-in ingredients you don't have. Never changes ones you've edited.</div>
    <button class="btn danger block" id="wipeBtn">Erase all data</button>
  </div>`;
  document.getElementById('exportBtn').onclick = async ()=>{
    const data = {app:'recipe-bank', version:1, exported_at: new Date().toISOString(),
      recipes: await getAll('recipes'), ingredients: await getAll('ingredients'),
      history: await getAll('history'), settings: await getAll('settings')};
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = `recipe-bank-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Backup downloaded');
  };
  document.getElementById('importFile').onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      if(!Array.isArray(data.recipes) || !Array.isArray(data.ingredients)) throw new Error("this doesn't look like a Recipe Bank backup");
      if(!(await appConfirm(`Replace everything with this backup (${data.recipes.length} recipes, ${data.ingredients.length} ingredients)?`, 'Restore'))){ e.target.value = ''; return; }
      for(const s of ['recipes','ingredients','history','settings']) await clearStore(s);
      await putMany('recipes', data.recipes);
      await putMany('ingredients', data.ingredients);
      await putMany('history', data.history || []);
      await putMany('settings', (data.settings || []).concat([{key:'seeded_recipes', value:true}]));
      toast('Backup restored');
      renderBackup(app);
    }catch(err){ toast('Could not read that file: ' + err.message); }
  };
  document.getElementById('starterBtn').onclick = async ()=>{
    const have = new Set((await getAll('ingredients')).map(x => x.key));
    const missing = parseSeedIngredients(SEED_INGREDIENTS).filter(x => !have.has(x.key))
      .map(x => (x.parent && !have.has(x.parent) && !SEED_INGREDIENTS.includes(`\n${x.parent}|`)) ? {...x, parent:null} : x);
    await putMany('ingredients', missing);
    toast(missing.length ? `Added ${missing.length} ingredient${missing.length > 1 ? 's' : ''}` : 'You already have them all');
    renderBackup(app);
  };
  document.getElementById('wipeBtn').onclick = async ()=>{
    if(!(await appConfirm('Erase ALL recipes, ingredients and history on this device? This cannot be undone.', 'Erase everything'))) return;
    for(const s of ['recipes','ingredients','history','settings']) await clearStore(s);
    await setSetting('seeded_recipes', true);
    await putMany('ingredients', parseSeedIngredients(SEED_INGREDIENTS));
    toast('Erased — starter ingredient dictionary restored');
    renderBackup(app);
  };
}
